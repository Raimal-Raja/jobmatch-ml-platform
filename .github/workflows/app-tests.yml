name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[resume,web]" playwright
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py --record-demo
      - name: Verify Docker demo
        run: |
          docker build -t jobmatch-demo .
          docker run -d --name jobmatch-demo -p 127.0.0.1:8000:8000 jobmatch-demo
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-proof
          path: |
            reports/ui-demo.png
            reports/two-minute-demo.webm
            reports/target-job-demo.png
  postgres:
    runs-on: ubuntu-latest
    services:
      database:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobmatch
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: jobmatch
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U jobmatch -d jobmatch" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[database]"
      - run: python -m unittest discover -s tests -p test_postgres.py -v
        env:
          JOBMATCH_TEST_DATABASE: '1'
          DATABASE_URL: postgresql://jobmatch:local_demo_only@localhost:5432/jobmatch
