name: Retrieval benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jobmatch/**'
      - 'tests/**'
      - 'data/**'
      - 'pyproject.toml'
      - '.github/workflows/retrieval-benchmark.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[resume,semantic,tracking]"
      - name: Run shared benchmark
        run: python -m jobmatch compare --repeats 100 --output reports/three-way-comparison.json --mlflow-dir private_data/experiments
      - name: Verify cached model and regression tests
        env:
          JOBMATCH_RUN_MODEL_TESTS: '1'
          HF_HUB_OFFLINE: '1'
        run: python -m unittest discover -s tests -v
      - name: Record installed dependencies
        run: python -m pip freeze --exclude-editable > reports/benchmark-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-comparison
          path: |
            reports/three-way-comparison.json
            reports/benchmark-requirements.txt
