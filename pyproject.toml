[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobmatch-ml-platform"
version = "0.4.0"
description = "Evidence-grounded job retrieval and evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
resume = ["pypdf>=5,<7"]
semantic = ["sentence-transformers==5.1.2", "transformers==4.57.1", "torch==2.8.0", "huggingface-hub==0.36.0"]

[tool.setuptools.packages.find]
include = ["jobmatch*"]
